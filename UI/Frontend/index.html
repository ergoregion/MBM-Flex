<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Room Layout Editor – Modular Version</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- Toolbar -->
    <div id="toolbar">
        <button id="add-room">Add Room</button>
        <button id="add-aperture">Add Aperture</button>
        <button id="save-layout">Save Layout</button>
        <label class="load-label">
            Load Layout
            <input id="fileInput" type="file" multiple style="display:none;">
        </label>
    </div>

    <!-- Link Mode Banner -->
    <div id="link-mode-banner">Link Mode Active — Select two rooms, then click an aperture</div>

    <!-- Editor Layout -->
    <div id="editor-container">
        <div id="canvas-container">
            <div id="canvas">
                <!-- Dynamic squares go here -->
            </div>

            <!-- SVG lines overlay -->
            <svg id="connection-lines"></svg>
        </div>

        <!-- JSON Editor -->
        <div id="json-editor-container">
            <h3>Object Data</h3>
            <textarea id="json-editor"></textarea>
            <div id="json-error">Invalid JSON</div>
        </div>
    </div>

    <!-- Main JS -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
